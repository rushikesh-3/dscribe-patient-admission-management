services:
  - type: web
    name: dscribe-patient-admission-api
    runtime: python
    repo: https://github.com/rushikesh-3/dscribe-patient-admission-management.git
    branch: main
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/database.db
    disk:
      name: dscribe-sqlite-data
      mountPath: /var/data
      sizeGB: 1
